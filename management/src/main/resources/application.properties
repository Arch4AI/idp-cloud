server.port=8090
#session cookie名称
server.servlet.session.cookie.name=CLOUD_STATE
#默认设置成24小时 用了redis session此设置无效
server.servlet.session.timeout=PT24H
#应用的名称
spring.application.name=dataease-cloud
#redis配置
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=redis
spring.data.redis.database=2
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
#mysql数据源配置
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/decloud?useSSL=false&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=test123
#配置默认的连接池Hikari
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.pool-name=DatebookHikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
#mybatis的配置
mybatis.mapper-locations=classpath:mapper/*Mapper.xml
# 开启缓存 默认是session
mybatis.configuration.cache-enabled=true
# 开启延迟加载
mybatis.configuration.lazy-loading-enabled=true
# 当开启时，任何方法的调用都会加载该对象的所有属性
mybatis.configuration.aggressive-lazy-loading=true
# 指定 MyBatis 应如何自动映射列到字段或属性。 NONE 表示取消自动映射；PARTIAL 只会自动映射没有定义嵌套结果集映射的结果集。 FULL 会自动映射任意复杂的结果集（无论是否嵌套）。
mybatis.configuration.auto-mapping-behavior=full
#设置超时时间，它决定驱动等待数据库响应的秒数。 最多1个小时
mybatis.configuration.default-statement-timeout=3600
#开启驼峰规则 针对列名与实体字段映射
mybatis.configuration.map-underscore-to-camel-case=true
#开启控制台日志
#mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
#设置Mybatis的分页 直接默认即可
#Flyway配置
spring.flyway.enabled=true
spring.flyway.table=cloud_version
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=false
#配置日志地址
logging.file.path=/opt/cloud/logs/${spring.application.name}
logging.level.root=info
management.server.port=6080
management.endpoints.web.exposure.include=*
# ----- 这个是quartz的 只能独立数据库 否则会有恶心的地方

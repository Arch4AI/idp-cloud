#spring.quartz.properties.threadsInheritContextClassLoaderOfInitializingThread=true
#默认的时间返回格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
#默认前端的地址
cloud.common.vite-addr=http://127.0.0.1:4000
cloud.common.address-enabled=true
cloud.common.enable-rate-limit=false
#cloud.common.enable-request-body-encrypt=true
#cloud.common.rate-limit-time-unit=microseconds
#短信配置 具体查看SmsProperties
#cloud.sms.provider=tencent
#cloud.sms.aliyun.template.login=1234
#cloud.sms.aliyun.template.register=1234
